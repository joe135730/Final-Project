<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.92);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    header .status {
      font-size: 0.95rem;
      color: var(--muted);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem 2rem;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.08);
      display: flex;
      flex-direction: column;
    }
    #mapWrapper {
      position: relative;
    }
    #mapCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .legend {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
      background: rgba(15,23,42,0.6);
      border-top: 1px solid rgba(148, 163, 184, 0.08);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .legend .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .panel h2 {
      margin: 0;
      padding: 1rem 1.25rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(148, 163, 184, 0.04);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    tbody td {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
    }
    .tag .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .metrics {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(148, 163, 184, 0.04);
    }
    .metrics div {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .metrics span.label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .metrics span.value {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .status-message {
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    @media (max-width: 1100px) {
      main {
        grid-template-columns: 1fr;
      }
      #mapWrapper {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>City Traffic Operations Center</h1>
    <div class="status">
      Last updated: <span id="updatedAt">--</span>
    </div>
  </header>
  <main>
    <section class="panel" id="mapWrapper">
      <canvas id="mapCanvas" width="860" height="540"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#2ecc71"></span>Smooth</span>
        <span><span class="dot" style="background:#f1c40f"></span>Moderate</span>
        <span><span class="dot" style="background:#e74c3c"></span>Congested</span>
        <span><span class="dot" style="background:#64748b"></span>No Data</span>
      </div>
    </section>
    <section class="panel">
      <h2>Live Road Metrics</h2>
      <div class="metrics">
        <div>
          <span class="label">Active Roads</span>
          <span class="value" id="metricActive">0</span>
        </div>
        <div>
          <span class="label">Average Speed (km/h)</span>
          <span class="value" id="metricAvgSpeed">--</span>
        </div>
      </div>
      <div class="status-message" id="statusMessage">Awaiting sensor data...</div>
      <table>
        <thead>
          <tr>
            <th>Road</th>
            <th>Status</th>
            <th>5s Flow</th>
            <th>60s Flow</th>
            <th>Avg Speed</th>
          </tr>
        </thead>
        <tbody id="summary"></tbody>
      </table>
    </section>
  </main>
  <script src="static/map.js"></script>
</body>
</html>
